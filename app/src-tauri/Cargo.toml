[package]
name = "notch-code"
version = "0.1.0"
description = "Live meeting transcription (local, Whisper)"
authors = ["Kacper Kołodziej"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notch_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasapi = "0.25.0"
whisper-rs = { version = "0.16.0", features = ["vulkan", "log_backend"] }
# device queries (integrated vs dedicated GPU); same version whisper-rs uses
whisper-rs-sys = "0.15.0"
sysinfo = "0.39.6"
chrono = "0.4.45"
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
log = "0.4.34"
sha2 = "0.10"
similar = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# what's playing (Home): Windows' media controls
windows = { version = "0.62", features = ["Foundation", "Media_Control", "Storage_Streams"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
